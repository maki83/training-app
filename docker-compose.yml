version: '3.8'

services:
  training-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: training-app:latest
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      # Use node (available in the image) to perform a lightweight HTTP check
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
