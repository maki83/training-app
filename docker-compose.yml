version: "3.9"

services:
  training-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: training-app:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', res => { if (res.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
